<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Smoke Effect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

function rand(a, b) { return Math.random() * (b - a) + a; }
function lerp(a, b, t) { return a + (b - a) * t; }

// ─── Noise from JSX (for spontaneous dissipation turbulence) ───
function noise(x, y, t) {
  return Math.sin(x * 0.007 + t * 0.001) *
         Math.cos(y * 0.009 + t * 0.0012) *
         Math.sin((x + y) * 0.005 + t * 0.0007) +
         Math.sin(x * 0.013 + y * 0.011 + t * 0.0018) * 0.5;
}

// ─── Arc Geometry (upward bow ∩) ───
function getArcPoint(t) {
  const arcCenterX = W * 0.5;
  const arcRadius = W * 0.85;
  const startAngle = -Math.PI * 0.72;
  const endAngle   = -Math.PI * 0.28;
  const angle = lerp(startAngle, endAngle, t);
  const x = arcCenterX + Math.cos(angle) * arcRadius;
  const y = H * 0.85 + Math.sin(angle) * arcRadius;
  return { x, y };
}

function getArcNormal(t) {
  const startAngle = -Math.PI * 0.72;
  const endAngle   = -Math.PI * 0.28;
  const angle = lerp(startAngle, endAngle, t);
  return { nx: Math.cos(angle), ny: Math.sin(angle) };
}

// ─── Fog Particles ───
const fogParticles = [];
function spawnFog() {
  fogParticles.push({
    x: rand(-200, W + 200),
    y: rand(0, H),
    vx: rand(0.08, 0.3) * (Math.random() < 0.5 ? 1 : -1),
    vy: rand(-0.03, 0.03),
    size: rand(150, 350),
    life: 1,
    decay: rand(0.0004, 0.0012),
    phase: rand(0, Math.PI * 2),
    baseAlpha: rand(0.04, 0.09)
  });
}
for (let i = 0; i < 40; i++) spawnFog();

// ─── Smoke Particles ───
const smokeParticles = [];
let waveTime = 0;

function spawnSmoke() {
  waveTime += 0.016;
  const wavePulse = (Math.sin(waveTime * 1.2) + 1) / 2;
  const wavePulse2 = (Math.sin(waveTime * 3.1 + 1.7) + 1) / 2;
  const combinedWave = wavePulse * 0.7 + wavePulse2 * 0.3;
  const emitCount = Math.floor(rand(1, 3) + combinedWave * 3);

  for (let i = 0; i < emitCount; i++) {
    const t = rand(0, 1);
    const pos = getArcPoint(t);
    const norm = getArcNormal(t);
    const speed = rand(0.1, 0.5) + combinedWave * 0.3;
    const jitterAngle = rand(-0.5, 0.5);
    const cosJ = Math.cos(jitterAngle);
    const sinJ = Math.sin(jitterAngle);
    const dirX = norm.nx * cosJ - norm.ny * sinJ;
    const dirY = norm.nx * sinJ + norm.ny * cosJ;
    const baseSize = rand(8, 25) + combinedWave * 20;
    const isWild = Math.random() < 0.12;

    smokeParticles.push({
      x: pos.x + rand(-8, 8),
      y: pos.y + rand(-5, 5),
      vx: dirX * speed * (isWild ? rand(1.5, 2.5) : 1),
      vy: dirY * speed * (isWild ? rand(1.5, 2.5) : 1),
      size: baseSize * (isWild ? rand(1.3, 2) : 1),
      growRate: rand(0.06, 0.2),
      life: 1,
      decay: rand(0.0003, 0.0012),
      noiseOffX: rand(0, 1000),
      noiseOffY: rand(0, 1000),
      drag: 0.998 + Math.random() * 0.0015,
      phase: rand(0, Math.PI * 2),
      // Deep crimson-red — critical danger color
      hue: rand(348, 358),
      sat: rand(82, 95),
      lightness: rand(28, 40),
      startAlpha: rand(0.2, 0.5),
      driftX: rand(-0.15, 0.15),
      cohortPhase: waveTime
    });
  }

  // Rare burst (from JSX: spontaneous puff)
  if (Math.random() < 0.007) {
    const burstCount = 3 + Math.floor(Math.random() * 5);
    for (let b = 0; b < burstCount; b++) {
      const t = rand(0.2, 0.8);
      const pos = getArcPoint(t);
      const norm = getArcNormal(t);
      const speed = rand(0.3, 0.8);
      const jA = rand(-0.8, 0.8);
      smokeParticles.push({
        x: pos.x + rand(-12, 12),
        y: pos.y + rand(-8, 8),
        vx: (norm.nx * Math.cos(jA) - norm.ny * Math.sin(jA)) * speed,
        vy: (norm.nx * Math.sin(jA) + norm.ny * Math.cos(jA)) * speed,
        size: rand(20, 45),
        growRate: rand(0.08, 0.25),
        life: 1,
        decay: rand(0.0004, 0.001),
        noiseOffX: rand(0, 1000),
        noiseOffY: rand(0, 1000),
        drag: 0.998 + Math.random() * 0.0015,
        phase: rand(0, Math.PI * 2),
        hue: rand(348, 358),
        sat: rand(85, 95),
        lightness: rand(25, 38),
        startAlpha: rand(0.25, 0.55),
        driftX: rand(-0.2, 0.2),
        cohortPhase: waveTime
      });
    }
  }
}

// ─── Draw Arc Lines ───
function drawArcLines() {
  ctx.save();
  ctx.lineCap = 'round';

  // Outer arc
  ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const p = getArcPoint(i / 120);
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = 'rgba(230, 60, 95, 0.6)';
  ctx.lineWidth = W * 0.045;
  ctx.stroke();

  // Inner arc
  ctx.beginPath();
  const innerOffset = W * 0.08;
  for (let i = 0; i <= 120; i++) {
    const t = i / 120;
    const p = getArcPoint(t);
    const n = getArcNormal(t);
    const ix = p.x - n.nx * innerOffset;
    const iy = p.y - n.ny * innerOffset;
    if (i === 0) ctx.moveTo(ix, iy);
    else ctx.lineTo(ix, iy);
  }
  ctx.strokeStyle = 'rgba(230, 60, 95, 0.45)';
  ctx.lineWidth = W * 0.035;
  ctx.stroke();

  ctx.restore();
}

// ─── Arc Glow ───
function drawArcGlow(time) {
  ctx.save();
  const pulse = (Math.sin(time * 0.001) + 1) / 2 * 0.15 + 0.85;
  for (let i = 0; i <= 60; i++) {
    const p = getArcPoint(i / 60);
    const glowSize = rand(40, 70) * pulse;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowSize);
    grad.addColorStop(0, `rgba(200, 30, 60, ${0.08 * pulse})`);
    grad.addColorStop(1, 'rgba(180, 20, 50, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, glowSize, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ─── Main Loop ───
let frameTime = 0;

// Initial fill for trail rendering
ctx.fillStyle = '#0a0a0f';
ctx.fillRect(0, 0, W * 2, H * 2);

function animate() {
  frameTime++;

  // ── Trail rendering (from JSX) for spontaneous dissipation ──
  // Instead of clearRect, overlay semi-transparent bg → ghostly lingering trails
  ctx.fillStyle = 'rgba(10, 10, 15, 0.055)';
  ctx.fillRect(0, 0, W, H);

  // Extra fade in upper zone where smoke travels (prevents permanent buildup)
  ctx.fillStyle = 'rgba(10, 10, 15, 0.02)';
  ctx.fillRect(0, 0, W, H * 0.5);

  // Periodic deeper clears (from JSX pattern)
  if (frameTime % 90 === 0) {
    ctx.fillStyle = 'rgba(10, 10, 15, 0.05)';
    ctx.fillRect(0, 0, W, H * 0.4);
  }
  if (frameTime % 140 === 0) {
    ctx.fillStyle = 'rgba(10, 10, 15, 0.06)';
    ctx.fillRect(0, 0, W, H);
  }

  // === Fog Background ===
  if (Math.random() < 0.06) spawnFog();
  for (let i = fogParticles.length - 1; i >= 0; i--) {
    const p = fogParticles[i];
    p.life -= p.decay;
    if (p.life <= 0) { fogParticles.splice(i, 1); continue; }
    p.x += p.vx;
    p.y += p.vy + Math.sin(frameTime * 0.003 + p.phase) * 0.08;
    if (p.x < -p.size) p.x = W + p.size;
    if (p.x > W + p.size) p.x = -p.size;
    const alpha = p.life * p.baseAlpha;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
    grad.addColorStop(0, `rgba(140, 145, 155, ${alpha})`);
    grad.addColorStop(0.4, `rgba(120, 125, 135, ${alpha * 0.5})`);
    grad.addColorStop(1, 'rgba(100, 105, 115, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // === Arc Glow + Lines ===
  drawArcGlow(frameTime);
  drawArcLines();

  // === Smoke ===
  spawnSmoke();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const p = smokeParticles[i];
    p.life -= p.decay;
    if (p.life <= 0) { smokeParticles.splice(i, 1); continue; }

    // JSX noise-driven turbulence for organic spontaneous motion
    const nf = noise(p.x * 0.007 + p.noiseOffX, p.y * 0.007 + p.noiseOffY, frameTime * 0.4);
    p.vx += nf * 0.004;
    p.vy += Math.cos(nf * 3) * 0.002;

    p.vx += p.driftX * 0.01;
    p.vy -= 0.004; // steady upward pull to reach the top
    p.x += p.vx;
    p.y += p.vy;
    p.size += p.growRate;

    // Drag (from JSX)
    p.vx *= p.drag;
    p.vy *= p.drag;

    // Dampen near top edge
    if (p.y < 60) {
      p.vy *= 0.97;
      p.vx *= 0.98;
    }

    // Alpha envelope with JSX-style fade-in
    const ageFraction = 1 - p.life;
    let alphaEnvelope;
    if (ageFraction < 0.05) {
      alphaEnvelope = ageFraction / 0.05;
    } else {
      alphaEnvelope = p.life;
    }
    const alpha = alphaEnvelope * p.startAlpha;

    // Color: stays deeply red/crimson — danger feel
    const sat = lerp(40, p.sat, p.life);
    const light = lerp(8, p.lightness, p.life);

    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
    grad.addColorStop(0,    `hsla(${p.hue}, ${sat}%, ${light}%, ${alpha * 0.9})`);
    grad.addColorStop(0.25, `hsla(${p.hue}, ${sat * 0.9}%, ${light * 0.75}%, ${alpha * 0.55})`);
    grad.addColorStop(0.55, `hsla(${p.hue}, ${sat * 0.8}%, ${light * 0.5}%, ${alpha * 0.15})`);
    grad.addColorStop(1,    `hsla(${p.hue}, ${sat * 0.7}%, ${light * 0.3}%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  // === Sparks along arc ===
  if (Math.random() < 0.3) {
    const t = rand(0, 1);
    const p = getArcPoint(t);
    const sparkSize = rand(2, 6);
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, sparkSize);
    grad.addColorStop(0, 'rgba(220, 50, 70, 0.9)');
    grad.addColorStop(1, 'rgba(180, 30, 50, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sparkSize, 0, Math.PI * 2);
    ctx.fill();
  }

  // Budget cap
  if (smokeParticles.length > 600) smokeParticles.splice(0, smokeParticles.length - 600);
  if (fogParticles.length > 60) fogParticles.splice(0, fogParticles.length - 60);

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
